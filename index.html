<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promptreel</title>
<style>
:root{--bg:#0e1013;--panel:#161a1f;--line:#262c34;--fg:#eef1f4;--mute:#8b95a1;--accent:#ff6a3d;--ink:#1a0b05;--ok:#4fd18b;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:20px 16px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:clamp(28px,5vw,42px);letter-spacing:-.02em}p{margin:0;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
textarea,input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%}
textarea{min-height:120px;resize:vertical}.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:block;margin-bottom:4px}
button{background:var(--accent);color:var(--ink);border:0;border-radius:8px;padding:13px;font:700 16px system-ui;cursor:pointer}
button:disabled{opacity:.5}.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 12px;font:14px system-ui}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.shot{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;color:var(--mute)}
.shot b{display:block;color:var(--fg)}.done b{color:var(--ok)}.fail b{color:var(--bad)}
video{width:100%;max-height:70vh;background:#000;border-radius:8px}
code{background:var(--bg);padding:2px 6px;border-radius:4px}
</style></head><body><div class="wrap">
<h1>Promptreel</h1><p>Describe your video. It is split into shots, each shot is generated by an AI video model, and the shots play back as one film.</p>
<div class="panel">
 <div><label for="p">Prompt</label><textarea id="p">A lone astronaut walks across a red desert planet at dawn, then discovers an ancient glowing door, then steps through into a forest of crystal trees.</textarea></div>
 <div class="row">
  <div><label for="len">Length (seconds, no cap)</label><input id="len" type="number" min="1" value="90"></div>
  <div><label for="clip">Seconds per shot (match your model)</label><input id="clip" type="number" min="1" value="8"></div>
  <div><label for="conc">Shots generated at once</label><input id="conc" type="number" min="1" value="4"></div>
 </div>
 <p id="est"></p>
 <button id="go">Generate video</button><p id="msg"></p>
</div>
<div class="panel" id="out" hidden>
 <video id="v" controls playsinline></video>
 <div class="shots" id="shots"></div>
 <div class="row"><button class="ghost" id="dl">Download all shot links (list.txt)</button></div>
 <p>To join the shots into one file: <code>ffmpeg -f concat -safe 0 -i list.txt -c copy film.mp4</code> after downloading the shots as shot1.mp4, shot2.mp4 …</p>
</div></div>
<script>
const $=i=>document.getElementById(i);let urls=[];
function plan(){const len=+$('len').value,clip=+$('clip').value;return Math.max(1,Math.ceil(len/clip));}
function est(){$('est').textContent=`${plan()} shots will be generated. Cost and time depend on your provider and model.`;}
['len','clip'].forEach(i=>$(i).oninput=est);est();
function makeShots(prompt,n){
 const beats=prompt.split(/[.;\n]|,?\s*\bthen\b/i).map(s=>s.trim()).filter(Boolean);if(!beats.length)beats.push(prompt);
 return Array.from({length:n},(_,i)=>{const b=beats[Math.floor(i*beats.length/n)];
  return `${b}. Shot ${i+1} of ${n} of one continuous film. Photorealistic, cinematic lighting, consistent characters and setting, smooth camera movement.`;});
}
$('go').onclick=async()=>{
 const n=plan(),conc=Math.max(1,+$('conc').value),shots=makeShots($('p').value.trim(),n);
 $('go').disabled=true;$('out').hidden=false;urls=new Array(n).fill(null);
 $('shots').innerHTML=shots.map((_,i)=>`<div class="shot" id="s${i}"><b>Shot ${i+1}</b><span>queued</span></div>`).join('');
 $('msg').textContent='Starting…';
 try{
  const ids=new Array(n);
  for(let i=0;i<n;i+=conc){
   const batch=shots.slice(i,i+conc);
   const r=await fetch('/.netlify/functions/start',{method:'POST',body:JSON.stringify({shots:batch})});
   const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not start');
   j.ids.forEach((id,k)=>ids[i+k]=id);
   await waitFor(j.ids,i);
  }
  $('msg').textContent='Done.';
 }catch(e){$('msg').textContent=e.message;}
 $('go').disabled=false;
};
async function waitFor(ids,off){
 let pending=new Set(ids.keys());
 while(pending.size){
  const r=await fetch('/.netlify/functions/status?ids='+ids.join(','));const list=await r.json();
  list.forEach((s,k)=>{const el=$('s'+(off+k));if(!el)return;el.querySelector('span').textContent=s.status;
   if(s.status==='succeeded'&&s.url){urls[off+k]=s.url;el.className='shot done';pending.delete(k);playlist();}
   if(s.status==='failed'||s.status==='canceled'){el.className='shot fail';el.querySelector('span').textContent=s.error||s.status;pending.delete(k);}});
  $('msg').textContent=`Generating shots ${off+1}–${off+ids.length}…`;
  if(pending.size)await new Promise(r=>setTimeout(r,4000));
 }
}
let idx=0;const v=$('v');
function playlist(){const ready=urls.filter(Boolean);if(!ready.length)return;if(!v.src){idx=0;v.src=ready[0];v.play().catch(()=>{});}}
v.onended=()=>{const ready=urls.filter(Boolean);idx++;if(idx<ready.length){v.src=ready[idx];v.play();}};
$('dl').onclick=()=>{const t=urls.filter(Boolean).map((u,i)=>`file 'shot${i+1}.mp4'`).join('\n')+'\n\n# Download each:\n'+urls.filter(Boolean).map((u,i)=>`shot${i+1}.mp4 = ${u}`).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='list.txt';a.click();};
</script></body></html>
